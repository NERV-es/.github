name: Close Stale Issues and PRs (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label. Default GitHub-hosted free; pass `self-hosted` for a private repo with billing-blocked hosted Actions.
        type: string
        default: ubuntu-latest
      days-before-stale:
        type: number
        default: 60
      days-before-close:
        type: number
        default: 14
      stale-issue-label:
        type: string
        default: stale
      stale-pr-label:
        type: string
        default: stale
      exempt-issue-labels:
        type: string
        default: 'pinned,security,keep'
      exempt-pr-labels:
        type: string
        default: 'pinned,security,keep'
      stale-issue-message:
        type: string
        default: >
          This issue has been automatically marked as stale because it has had
          no activity for 60 days. It will be closed in 14 days if no further
          activity occurs. Remove the stale label or comment to keep it open.
      stale-pr-message:
        type: string
        default: >
          This pull request has been automatically marked as stale because it
          has had no activity for 60 days. It will be closed in 14 days if no
          further activity occurs. Remove the stale label or comment to keep it open.
      close-issue-message:
        type: string
        default: >
          This issue was closed because it has been stale for 14 days with no activity.
      close-pr-message:
        type: string
        default: >
          This pull request was closed because it has been stale for 14 days with no activity.

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-label: ${{ inputs.stale-issue-label }}
          stale-pr-label: ${{ inputs.stale-pr-label }}
          exempt-issue-labels: ${{ inputs.exempt-issue-labels }}
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
          stale-issue-message: ${{ inputs.stale-issue-message }}
          stale-pr-message: ${{ inputs.stale-pr-message }}
          close-issue-message: ${{ inputs.close-issue-message }}
          close-pr-message: ${{ inputs.close-pr-message }}
