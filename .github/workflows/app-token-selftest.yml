name: App Token Self-Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.NERV_APP_ID }}
          private-key: ${{ secrets.NERV_APP_PRIVATE_KEY }}
          owner: NERV-es
      - name: Show authenticated identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "Authenticated as:"
          gh api /installation/repositories --jq '.total_count as $c | "repos accessible: \($c)"'
          gh api repos/NERV-es/.github --jq '"can read .github: " + .full_name'
          echo "App slug: ${{ steps.app.outputs.app-slug }}"
