name: Open App PR (reusable)

# Dependabot-style PR opener that runs AS the Bobby-Claws GitHub App.
#
# A caller supplies a `run` command that mutates the working tree; if it
# produces a diff, this opens (or updates) a Bobby-Claws-authored PR and can
# squash-merge it automatically. This is the hands-off alternative to pushing
# straight to a branch: the change lands as a reviewable, attributed PR that
# your existing checks gate, exactly like Dependabot's flow — but driven by
# your own org App so it can touch .github/workflows/** (a PAT/GITHUB_TOKEN
# cannot) across every repo.
#
# Why an App token and not GITHUB_TOKEN:
#   * Commits/PRs are attributed to bobby-claws[bot] (verified author), not
#     github-actions[bot].
#   * An App-token PR DOES trigger downstream workflows, so CI runs on it and
#     can gate the auto-merge (GITHUB_TOKEN PRs do not re-trigger workflows).
#   * The org-wide install grants contents:write + pull-requests:write +
#     workflows:write, so it can open PRs that edit workflow files.

on:
  workflow_call:
    inputs:
      run:
        description: 'Shell that mutates the working tree (the change to PR).'
        type: string
        required: true
      branch:
        description: 'Head-branch prefix; a UTC timestamp is appended.'
        type: string
        required: false
        default: 'bot/auto'
      title:
        description: 'PR title.'
        type: string
        required: true
      body:
        description: 'PR body (markdown).'
        type: string
        required: false
        default: 'Automated maintenance by the Bobby-Claws app.'
      commit-message:
        description: 'Commit message.'
        type: string
        required: true
      base:
        description: 'Base branch (blank = the repo default branch).'
        type: string
        required: false
        default: ''
      labels:
        description: 'Comma-separated labels to add (created if missing).'
        type: string
        required: false
        default: 'automated'
      auto-merge:
        description: 'Merge the PR automatically once its checks pass.'
        type: boolean
        required: false
        default: true
      merge-wait-minutes:
        description: 'Max minutes to wait for checks before giving up (private repos that lack native auto-merge).'
        type: number
        required: false
        default: 20
      runs-on:
        description: 'Runner label for the job (e.g. ubuntu-latest, or self-hosted for a private repo).'
        type: string
        required: false
        default: 'ubuntu-latest'
      bot-auth:
        description: 'Auth mode for the bot: app (GitHub App, default) or pat (caller-supplied BOT_PAT secret, for private repos where org App secrets are unavailable).'
        type: string
        required: false
        default: 'app'
  workflow_dispatch:
    inputs:
      run:
        description: 'Shell that mutates the working tree (the change to PR).'
        type: string
        required: true
      branch:
        description: 'Head-branch prefix; a UTC timestamp is appended.'
        type: string
        required: false
        default: 'bot/auto'
      title:
        description: 'PR title.'
        type: string
        required: true
      body:
        description: 'PR body (markdown).'
        type: string
        required: false
        default: 'Automated maintenance by the Bobby-Claws app.'
      commit-message:
        description: 'Commit message.'
        type: string
        required: true
      base:
        description: 'Base branch (blank = the repo default branch).'
        type: string
        required: false
        default: ''
      labels:
        description: 'Comma-separated labels to add (created if missing).'
        type: string
        required: false
        default: 'automated'
      auto-merge:
        description: 'Merge the PR automatically once its checks pass.'
        type: boolean
        required: false
        default: true
      merge-wait-minutes:
        description: 'Max minutes to wait for checks before giving up (private repos that lack native auto-merge).'
        type: number
        required: false
        default: 20
      runs-on:
        description: 'Runner label for the job (e.g. ubuntu-latest, or self-hosted for a private repo).'
        type: string
        required: false
        default: 'ubuntu-latest'
      bot-auth:
        description: 'Auth mode for the bot: app (GitHub App, default) or pat (caller-supplied BOT_PAT secret, for private repos where org App secrets are unavailable).'
        type: string
        required: false
        default: 'app'

permissions:
  contents: read

concurrency:
  group: open-app-pr-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        # harden-runner is GitHub-hosted-Ubuntu only; skip it on self-hosted.
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Short-lived org-wide installation token for the Bobby-Claws App.
      - name: Generate app token (bobby-claws)
        id: app-token
        if: ${{ inputs.bot-auth == 'app' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.NERV_APP_ID }}
          private-key: ${{ secrets.NERV_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.BOT_PAT }}
          persist-credentials: false

      - name: Open or update a Bobby-Claws PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_PAT }}
          TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_PAT }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_AUTH: ${{ inputs.bot-auth }}
          REPO: ${{ github.repository }}
          RUN_CMD: ${{ inputs.run }}
          BRANCH_PREFIX: ${{ inputs.branch }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
          COMMIT_MSG: ${{ inputs.commit-message }}
          BASE_IN: ${{ inputs.base }}
          LABELS: ${{ inputs.labels }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          MERGE_WAIT: ${{ inputs.merge-wait-minutes }}
        run: |
          set -euo pipefail

          # ── Bot identity (verified-author attribution) ──────────────────────
          if [ "${BOT_AUTH:-app}" = "pat" ]; then
            # PAT mode: author commits as the PAT's owning account.
            login=$(gh api /user --jq .login)
            uid=$(gh api /user --jq .id)
            git config user.name  "$login"
            git config user.email "${uid}+${login}@users.noreply.github.com"
          else
            bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name  "${APP_SLUG}[bot]"
            git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          fi

          base="${BASE_IN}"
          [ -z "$base" ] && base=$(gh api "repos/$REPO" --jq .default_branch)

          # ── Produce the change ──────────────────────────────────────────────
          bash -euo pipefail -c "$RUN_CMD"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced — nothing to PR."
            exit 0
          fi

          head="${BRANCH_PREFIX}/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$head"
          git add -A
          git commit -m "$COMMIT_MSG"
          # Push over the App token URL (persist-credentials:false above means the
          # checkout left no competing extraheader to override it).
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${head}"

          # ── Open the PR (idempotent on the head branch) ─────────────────────
          pr=$(gh pr list --repo "$REPO" --head "$head" --state open \
                 --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --repo "$REPO" --base "$base" --head "$head" \
                    --title "$PR_TITLE" --body "$PR_BODY")
            pr=$(printf '%s' "$url" | grep -oE '[0-9]+$' | tail -1)
            echo "Opened PR #$pr — $url"
          else
            echo "Reusing open PR #$pr on $head"
          fi

          # ── Labels (best-effort; create if absent) ──────────────────────────
          OLD_IFS=$IFS; IFS=','
          for l in $LABELS; do
            l=$(printf '%s' "$l" | xargs)
            [ -z "$l" ] && continue
            gh label create "$l" --repo "$REPO" --force >/dev/null 2>&1 || true
            gh pr edit "$pr" --repo "$REPO" --add-label "$l" >/dev/null 2>&1 || true
          done
          IFS=$OLD_IFS

          # ── Auto-merge on pass ──────────────────────────────────────────────
          # Prefer GitHub native auto-merge: it merges ONLY once required checks
          # go green. Where native auto-merge is unavailable (e.g. private free
          # repos, where it cannot be enabled), fall back to watching the checks
          # ourselves and squash-merging only if they all pass within the budget.
          if [ "$AUTO_MERGE" = "true" ]; then
            if gh pr merge "$pr" --repo "$REPO" --squash --auto 2>/tmp/automerge.err; then
              echo "Native auto-merge armed for PR #$pr (merges when checks pass)."
            else
              echo "Native auto-merge unavailable: $(tr '\n' ' ' </tmp/automerge.err)"
              echo "Falling back to wait-for-checks (up to ${MERGE_WAIT}m)…"
              if gh pr checks "$pr" --repo "$REPO" >/tmp/checks.out 2>&1 \
                   || ! grep -qi 'no checks' /tmp/checks.out; then
                if timeout "${MERGE_WAIT}m" gh pr checks "$pr" --repo "$REPO" \
                     --watch --interval 30 --fail-fast; then
                  gh pr merge "$pr" --repo "$REPO" --squash \
                    && echo "Checks passed — squash-merged PR #$pr." \
                    || echo "::warning::Checks passed but merge failed; PR #$pr left open."
                else
                  echo "::warning::Checks failed or timed out (${MERGE_WAIT}m); PR #$pr left open for review."
                fi
              else
                gh pr merge "$pr" --repo "$REPO" --squash \
                  && echo "No checks configured — squash-merged PR #$pr." \
                  || echo "::warning::Merge failed; PR #$pr left open."
              fi
            fi
          else
            echo "PR #$pr left open (auto-merge disabled)."
          fi
