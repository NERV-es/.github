name: Dependency Review (reusable)

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum severity that fails the check (low|moderate|high|critical).
        type: string
        default: high
      base-ref:
        description: Base ref to compare against. Defaults to the PR base branch.
        type: string
        required: false
      head-ref:
        description: Head ref to compare. Defaults to the PR head branch.
        type: string
        required: false
      comment-summary-in-pr:
        description: When to post the PR summary comment (always|on-failure|never).
        type: string
        default: on-failure
      harden_runner:
        description: Run step-security/harden-runner first.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        if: inputs.harden_runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}
          comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
          warn-only: false
