name: AI Review

# Thin caller. Logic lives in NERV-es/.github (SHA-pinned to the canonical
# reusable). Free multi-LLM review on every PR plus an on-demand /bobby
# re-review command. Advisory only.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  review:
    uses: NERV-es/.github/.github/workflows/ai-review-reusable.yml@b82344e38a5d6f4b1868c0968a2d77079d5079a3
    secrets: inherit
