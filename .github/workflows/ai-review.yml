name: AI Review

# Thin caller. Logic lives in NERV-es/.github (SHA-pinned to the canonical
# reusable). Free multi-LLM review on every PR plus an on-demand /bobby
# re-review command. Advisory only.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  review:
    uses: NERV-es/.github/.github/workflows/ai-review-reusable.yml@41626480016f1fde9d2f985a1b7cd8d42ae076ce
    secrets: inherit
