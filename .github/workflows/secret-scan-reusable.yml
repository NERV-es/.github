name: Secret Scan (reusable)

# TruffleHog secret scanning. Pinned to an immutable commit SHA
# (not @main) to avoid CI supply-chain risk. No external token
# required — uses the built-in GITHUB_TOKEN read scope.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --results=verified,unknown