name: Secret Scan (reusable)

# TruffleHog secret scanning. Pinned to an immutable commit SHA
# (not @main) to avoid CI supply-chain risk. No external token
# required — uses the built-in GITHUB_TOKEN read scope.

on:
  workflow_call:
    inputs:
      harden_runner:
        description: Run step-security/harden-runner first.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        if: inputs.harden_runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@1aa1871f9ae24a8c8a3a48a9345514acf42beb39 # v3.82.13
        with:
          extra_args: --results=verified,unknown
