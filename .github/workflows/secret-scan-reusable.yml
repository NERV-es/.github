name: Secret Scan (reusable)

# TruffleHog secret scanning. Pinned to an immutable commit SHA
# (not @main) to avoid CI supply-chain risk. No external token
# required — uses the built-in GITHUB_TOKEN read scope.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown