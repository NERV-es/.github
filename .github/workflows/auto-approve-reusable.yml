name: Auto Approve Dependabot (reusable)

# Auto-approves Dependabot PRs only. No external token required
# (uses the built-in github-actions bot). Scoped tightly via the
# pull_request.user.login guard (immutable PR author) rather than
# github.actor, which is mutable via "@dependabot recreate" and
# vulnerable to confused-deputy / pwn-request attacks.

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label. Default GitHub-hosted free; pass `self-hosted` for a private repo with billing-blocked hosted Actions.
        type: string
        default: ubuntu-latest
      auto_merge:
        description: After approval, enable auto-merge (or a direct squash-merge fallback) for patch/minor Dependabot updates.
        type: boolean
        default: false
      harden_runner:
        description: Run step-security/harden-runner first (only meaningful on GitHub-hosted runners; self-hosted runners typically manage their own egress policy).
        type: boolean
        default: false

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ${{ inputs.runs_on }}
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        if: inputs.harden_runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
      - uses: hmarr/auto-approve-action@8f929096a962e83ccdfa8afcf855f39f12d4dac7 # v4
        with:
          review-message: "Auto-approved Dependabot dependency update."
      - name: Enable auto-merge (patch/minor only)
        if: inputs.auto_merge && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr merge --auto --squash "$PR_URL" 2>/dev/null; then
            echo "Native auto-merge unavailable on this plan — merging directly."
            gh pr merge --squash "$PR_URL"
          fi
