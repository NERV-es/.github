name: Auto Approve Dependabot (reusable)

# Auto-approves Dependabot PRs only. No external token required
# (uses the built-in github-actions bot). Scoped tightly via the
# pull_request.user.login guard (immutable PR author) rather than
# github.actor, which is mutable via "@dependabot recreate" and
# vulnerable to confused-deputy / pwn-request attacks.

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - uses: hmarr/auto-approve-action@05a696a09d381a5a0d142c755f7eacbb19eb6525 # v4
        with:
          review-message: "Auto-approved Dependabot dependency update."