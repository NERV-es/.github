name: CodeQL (shared)

# Shared CodeQL analysis. Logic lives here in NERV-es/.github; every repo calls
# it via a byte-identical SHA-pinned stub (.github/workflows/codeql-shared.yml).
# Languages are auto-detected from the repo (GitHub Languages API) and always
# include "actions" so workflow files are scanned everywhere.
#
# NOTE: code scanning upload is free for PUBLIC repos only; private repos need
# GitHub Advanced Security. Deploy the stub to public repos.

on:
  workflow_call:
    inputs:
      languages:
        description: 'Comma-separated CodeQL languages, or "auto" to detect.'
        type: string
        default: auto

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      empty: ${{ steps.set.outputs.empty }}
    steps:
      - id: set
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const input = `${{ inputs.languages }}`.trim();
            const map = {
              'C': 'c-cpp', 'C++': 'c-cpp', 'Objective-C': 'c-cpp', 'Objective-C++': 'c-cpp',
              'C#': 'csharp', 'Go': 'go', 'Java': 'java-kotlin', 'Kotlin': 'java-kotlin',
              'JavaScript': 'javascript-typescript', 'TypeScript': 'javascript-typescript',
              'Python': 'python', 'Ruby': 'ruby', 'Swift': 'swift'
            };
            const noBuild = new Set(['actions', 'javascript-typescript', 'python', 'ruby', 'csharp', 'java-kotlin']);
            const langs = new Set(['actions']);
            if (input && input !== 'auto') {
              input.split(',').map(s => s.trim()).filter(Boolean).forEach(l => langs.add(l));
            } else {
              const res = await github.rest.repos.listLanguages({ owner: context.repo.owner, repo: context.repo.repo });
              for (const k of Object.keys(res.data)) { if (map[k]) langs.add(map[k]); }
            }
            const arr = [...langs];
            const include = arr.map(l => ({
              language: l,
              runner: l === 'swift' ? 'macos-latest' : 'ubuntu-latest',
              build_mode: noBuild.has(l) ? 'none' : 'autobuild',
            }));
            core.setOutput('matrix', JSON.stringify({ include }));
            core.setOutput('empty', arr.length ? 'false' : 'true');
            core.info('CodeQL languages: ' + arr.join(', '));

  analyze:
    needs: detect
    if: needs.detect.outputs.empty == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          category: "/language:${{ matrix.language }}"
