name: Pipelock Agent Security Scan (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pipelock:
    name: Agent egress / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run Pipelock scan
        uses: luckyPipewrench/pipelock@9d2e37d296359c38e599525a0424cdc189a812e1 # v3.0.0
        with:
          scan-diff: true
          fail-on-findings: false
          # The action's built-in 30-vector self-test (run with --fail-on-gap)
          # has a known false failure in v1.3.0 (high-entropy path segment +
          # MCP-scan gaps) that is unrelated to this repo's contents. The real
          # secret/egress diff scan above still runs; only the self-test gate
          # is disabled.
          test-vectors: false