name: AI Review (reusable)

# ONE org-wide AI PR reviewer, hosted here in the PUBLIC NERV-es/.github repo so
# every repo in the org (public or private) can call it with an 8-line stub:
#
#   jobs:
#     ai-review:
#       uses: NERV-es/.github/.github/workflows/ai-review-reusable.yml@ai-review-v1
#       secrets: inherit
#
# (The doubled `.github/.github/` is correct: the first is the repo named
#  `.github`, the second is its workflows dir. Pin to the immutable tag.)
#
# WHY THIS SHAPE: the org doesn't pay for Copilot. The reviewer (ai_review.py)
# fans each PR diff out to every LLM whose key is present and posts ONE
# self-updating, high-signal comment. Cross-model agreement is a strong signal;
# any provider being down/rate-limited just drops out.
#
# ZERO-CONFIG DEFAULT: GitHub Models (free, models:read, built-in token) is
# always-on provider #1 — a caller needs NO secrets at all. Adding any of the
# external free-tier keys (Groq/Cerebras/Gemini/OpenRouter/Mistral) via
# `secrets: inherit` just adds redundancy. Free orgs can't push org-level
# secrets to private repos, so per-repo secrets + `secrets: inherit` is the
# correct delivery mechanism.
#
# WEBHOOK-OUT: when AGENTGATEWAY_WEBHOOK_URL is set the job ALSO POSTs an
# HMAC-signed PR payload so the NERV agent fleet can pick up a deep review.
# Dormant until that secret exists.

on:
  workflow_call:
    inputs:
      max_diff_chars:
        description: Truncate the diff sent to the models (free tiers have small context windows).
        type: number
        default: 28000
      chunk_strategy:
        description: Big-PR handling — keep (truncate), sequential (one provider, many chunks), or crossprovider (spread chunks across providers).
        type: string
        default: crossprovider
      max_review_chunks:
        description: Max pieces a large PR is split into (bounds free-tier usage).
        type: number
        default: 4
      peer_context:
        description: Read other review bots' comments on the PR and feed them to the model (corroborate + add what they missed).
        type: boolean
        default: true
      synthesize:
        description: On big/chunked PRs, merge the per-part reviews + bot summaries into one deduped final review via a medium-budget provider.
        type: boolean
        default: true
      reviewer_ref:
        description: Ref of NERV-es/.github to fetch ai_review.py from (keep in lockstep with the pinned tag).
        type: string
        default: ai-review-v1

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Probe gateway secret presence (can't be read in a job-level `if`). The review
  # job itself is unconditional — GitHub Models needs no key.
  guard:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.probe.outputs.gateway }}
    steps:
      - name: Probe gateway secret
        id: probe
        env:
          AGENTGATEWAY_WEBHOOK_URL: ${{ secrets.AGENTGATEWAY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${AGENTGATEWAY_WEBHOOK_URL}" ]; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    # Scope: only NERV + the org .github repo opt in for now. The reusable is
    # public, so this defensive allowlist stops any other caller from running
    # reviews until explicitly added here. Also skips bot-authored PRs.
    if: >-
      ${{ github.event.pull_request.user.type != 'Bot'
        && (github.repository == 'NERV-es/NERV'
            || github.repository == 'NERV-es/.github') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout + diff
      pull-requests: write # post the review comment
      models: read # free GitHub Models inference
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR head (for the diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch reviewer script from NERV-es/.github
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NERV-es/.github
          ref: ${{ inputs.reviewer_ref }}
          path: .nerv-github
          persist-credentials: false

      - name: Build PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Exclude vendored/generated/lock noise so the models spend their small
          # context on code we actually own.
          git diff --unified=1 "$BASE_SHA"..."$HEAD_SHA" -- . \
            ':(exclude)**/node_modules/**' \
            ':(exclude)**/*-lock.json' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)**/*.min.*' \
            ':(exclude).obsidian/**' \
            ':(exclude).trunk/**' \
            ':(exclude)**/*.svg' \
            > /tmp/pr.diff || true
          echo "diff bytes: $(wc -c < /tmp/pr.diff)"

      - name: Multi-LLM review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_FILE: /tmp/pr.diff
          MAX_DIFF_CHARS: ${{ inputs.max_diff_chars }}
          CHUNK_STRATEGY: ${{ inputs.chunk_strategy }}
          MAX_REVIEW_CHUNKS: ${{ inputs.max_review_chunks }}
          PEER_CONTEXT: ${{ inputs.peer_context && '1' || '0' }}
          SYNTHESIZE: ${{ inputs.synthesize && '1' || '0' }}
          # Zero-config default provider — always present (falls back to the
          # built-in Actions token with models:read).
          GH_MODELS_TOKEN: ${{ secrets.MODELS_TOKEN != '' && secrets.MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          # Optional external free-tier providers (add redundancy when set).
          # A *_2 key is a second account for the same provider — the script
          # rotates to it on a 429, ~doubling that provider's free capacity.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          # Cloudflare Workers AI needs the account id in its URL — stays
          # dormant until CLOUDFLARE_ACCOUNT_ID is also set.
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .nerv-github/.github/scripts/ai_review.py

  # Hand the PR off to the NERV agent fleet for a deep review. Gated on the
  # webhook URL secret so it stays dormant until the homelab is reachable.
  webhook-out:
    needs: guard
    if: needs.guard.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: POST signed PR event to AgentGateway
        env:
          WEBHOOK_URL: ${{ secrets.AGENTGATEWAY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.AGENTGATEWAY_WEBHOOK_SECRET }}
          PAYLOAD: >-
            {"event":"pull_request","action":"${{ github.event.action }}",
            "repo":"${{ github.repository }}",
            "number":${{ github.event.pull_request.number }},
            "title":${{ toJSON(github.event.pull_request.title) }},
            "url":"${{ github.event.pull_request.html_url }}",
            "base":"${{ github.event.pull_request.base.sha }}",
            "head":"${{ github.event.pull_request.head.sha }}",
            "author":"${{ github.event.pull_request.user.login }}"}
        run: |
          set -euo pipefail
          # HMAC-SHA256 over the body (GitHub's X-Hub-Signature-256 scheme) so
          # the homelab receiver can verify authenticity before acting.
          sig="sha256=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET:-}" -hex \
            | awk '{print $NF}')"
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            --max-time 20 --retry 2 \
            -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $sig" \
            -H 'X-NERV-Event: pull_request' \
            --data "$PAYLOAD") || true
          echo "AgentGateway responded HTTP $code"
          cat /tmp/resp.txt || true
          # Advisory: never fail the PR if the homelab is momentarily down.
          if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
            echo "::warning::AgentGateway webhook delivery failed (HTTP $code)"
          fi
